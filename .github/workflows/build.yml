name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libxcb-cursor-dev \
            libpulse-dev \
            libasound2-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          modules: >-
            qtcharts
            qtmultimedia
            qtpositioning
            qtlocation
            qtwebsockets
            qtshadertools
            qtquick3d
            qtgraphs
            qtimageformats
            qt5compat
            qtpdf

      - name: Configure
        run: cmake -B build -S .

      - name: Build
        run: cmake --build build --parallel $(nproc)
